<body>

    <nav class="navbar navbar-dark bg-dark shadow-lg" data-bs-theme="dark">

    <div class="row mt-4 m-auto">
        <div class="col-2">
            <button class="btn btn-primary mt-4" onclick="showAll()">showAll</button>
        </div>
        <!-- <div class="col-2"> -->

        <!-- <div class="col-2"> -->
        <!-- <button class="btn btn-primary mt-4" onclick="female()">Female</button> -->
        <!-- </div> -->

        <div class="col-2">
            <button class="btn btn-primary mt-4" onclick="gender('male')">Male</button>
        </div>
        <div class="col-2">
            <button class="btn btn-primary mt-4" onclick="gender('female')">Female</button>
        </div>
        <div class="col-3 mt-4">
            <input type="text" id="SearchInput" class="form-control" placeholder="Search by name"
                oninput="searchStudents()">
        </div>
    </div>
    <div>
        <table class="table table-dark table-hover table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>gender</th>
                </tr>
            </thead>
            <tbody id="data"></tbody>
        </table>
    </div>

    <script>
        //instead of writing all students one by one in table to reduce that effort we have to use objects for storing multiple students record in one list
        let Students = [{ id: 101, name: "Siddhartha", gender: "male" }, { id: 102, name: "Srija", gender: "female" },
        { id: 106, name: "Sugendhar", gender: "male" }, { id: 109, name: "Sathwika", gender: "female" }, { id: 121, name: "Amrutha", gender: "female" },
        { id: 120, name: "Akhil", gender: "male" }]

        let d = document.getElementById("data");

        function display(arr) {
            let res = "";
            arr.forEach(element => {
                res += `<tr>
                    <td>${element.id}</td>
                    <td>${element.name}</td>
                    <td>${element.gender}</td>
                    </tr>
                `;
            });
            d.innerHTML = res;
        }
        //filter():filter method return array of elements which meets the condition specified on the function
        // function male(){
        // display(Students.filter((m)=>m.gender=="male"));
        // }
        // function female(){
        // display(Students.filter((n)=>n.gender=="female"))
        // }


        function showAll() {
            display(Students);
        }
        function gender(gender) {
            display(Students.filter((k) => k.gender == gender));
        }

        //search students by name 
        //in input type search bar we given id="SearchInput"
        //when user enter the name some actions must be performed by using function
        //actionListner(): it is method to perform action when user enter name it can be coverted into lowercase
        //filter():it search every student according to the condition which specified in function and it convert to lowercase
        //includes():it return true if search value present in the student data
        //here the student name compare with searchInput name if it matches it return data of that person


        //Using DOM elements and accessing the id using getElementById() method
        // let searchInput=document.getElementById("SearchInput");

        // searchInput.addEventListener("input",function(){
        // let searchValue=searchInput.value.toLowerCase();
        // let filterStudents=Students.filter((student)=>
        // student.name.toLowerCase().includes(searchValue)
        // );
        // display(filterStudents);

        // });

        // function name(){
        // let a=document.getElementById("SearchInput").value.toLowerCase();

        // display(Students.filter((student)=>student.name.toLowerCase().includes(a)));
        // 
        // }
        // display(Students);

        function searchStudents() {
            let a = document.getElementById("SearchInput").value.toLowerCase();

            console.log("Search value:", a);

            let result = Students.filter((student) =>
                student.name.toLowerCase().includes(a)
            );

            console.log("Filtered students:", result);

            display(result);
        }
        display(Students);

        async function loadDummyData() {
            try {
                let response = await fetch("https://dummyjson.com/users");

                if (!response.ok) {
                    throw new Error("Failed to fetch student data");
                }

                let result = await response.json();

                Students = result.users.map((user) => ({
                    id: user.id,
                    name: user.firstName + " " + user.lastName,
                    gender: user.gender
                }));
                display(Students);
            }
            catch (error) {
                console.log("Error loading dummy json data:", error);
            }



        }
        loadDummyData();


    </script>
